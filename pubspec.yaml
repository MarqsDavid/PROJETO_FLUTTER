name: dmega
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_login: ^5.0.0
  flutter_login_vk: ^2.2.2+1
  flutter_screenutil: ^5.9.3
  circle_nav_bar: ^2.0.0
  responsive_builder: ^0.7.1
  wolt_modal_sheet: ^0.9.2
  search_page: ^2.3.0
  sqflite: ^2.0.0+4
  path_provider: ^2.0.0
  http: ^1.2.2


  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/logo.ico"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Assets configuration
  assets:
    - assets/images/logo.ico
    - assets/images/icon2.jpg
    - assets/images/Dmega-logo.png

    # Uncomment and add specific files if needed
